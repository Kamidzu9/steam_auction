[package]
name = "steam-auction-desktop"
version = "26.0"
description = "Steam Auction – desktop client powered by Tauri"
authors = ["Steam Auction Contributors"]
license = ""
repository = ""
default-run = "steam-auction-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "steam_auction_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
