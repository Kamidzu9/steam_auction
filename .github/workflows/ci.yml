name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install CSS native bindings (Linux)
        working-directory: apps/web
        run: npm install --no-save lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu

      - name: Type-check (shared)
        run: npx tsc --noEmit --project packages/shared/tsconfig.json

      - name: Type-check (api-client)
        run: npx tsc --noEmit --project packages/api-client/tsconfig.json

      - name: Type-check (api)
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: Test (shared)
        run: npm test --workspace=packages/shared

      - name: Test (api-client)
        run: npm test --workspace=packages/api-client

      - name: Test (api)
        run: npm test --workspace=apps/api

      - name: Test (web)
        run: npm test --workspace=apps/web

      - name: Security audit
        run: npm audit --omit=dev || true

  build-api:
    name: Build API
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build shared (required by api)
        run: npm run build --workspace=packages/shared

      - name: Build api
        run: npm run build --workspace=apps/api

  build-web:
    name: Build Web
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install CSS native bindings (Linux)
        working-directory: apps/web
        run: npm install --no-save lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu

      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
